# Parameters for Nav2 on the Unitree Go2 in Localization Mode
# This version explicitly defines and links the goal_checker to the controller.

# Top-level namespaces for each Nav2 server
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    
    # --- FIX PART 1: Explicitly load the goal checker plugin ---
    # This tells the controller_server to create an instance of the SimpleGoalChecker.
    goal_checker_plugins: ["SimpleGoalChecker"]

    # This lists the controller plugins to load.
    plugins: ["FollowPath"]

    # --- Parameters for the DWB Controller Plugin ---
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      
      # --- FIX PART 2: Assign the loaded goal checker to this controller ---
      goal_checker: "SimpleGoalChecker"
      
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Add other DWB parameters if needed...
      
    # --- FIX PART 3: Provide the parameters for the goal checker plugin ---
    SimpleGoalChecker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True # True is recommended for DWB

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
      
behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered

local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: "base_link"
    update_frequency: 5.0
    publish_frequency: 2.0
    width: 3
    height: 3
    resolution: 0.05
    robot_radius: 0.22
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: scan
      scan: {topic: /scan_reliable, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan}
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.35

global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: "base_link"
    update_frequency: 1.0
    publish_frequency: 1.0
    resolution: 0.05
    robot_radius: 0.22
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: true
    obstacle_layer:
       plugin: "nav2_costmap_2d::ObstacleLayer"
       enabled: true
       observation_sources: scan
       scan: {topic: /scan_reliable, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan}
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.35

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    # Add other AMCL parameters as needed...